name: build-apk
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null || true
          ls "$ANDROID_HOME/ndk" || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build native ripgrep
        run: |
          cargo install cargo-ndk --locked
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* | head -1)
          export ANDROID_NDK_HOME="$NDK_DIR"
          cd tools/native_ripgrep
          cargo ndk -t arm64-v8a -o ../../app/src/main/jniLibs build --release
      - name: Fetch FFmpegKit AAR
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/ffmpeg-kit-local.aar https://maven.aliyun.com/repository/public/com/arthenica/ffmpeg-kit-full-gpl/6.0-2/ffmpeg-kit-full-gpl-6.0-2.aar
          unzip -l app/libs/ffmpeg-kit-local.aar | grep -c "jni/arm64-v8a"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: operit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
